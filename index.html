  <style>
    * { box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent }
    html,body { background:#f2f2f7;font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;-webkit-text-size-adjust:100% }
    @keyframes ab { 0%,100% { height:3px } 50% { height:22px } }
    .ab { width:3px;background:rgba(255,255,255,0.55);border-radius:3px;
           animation:ab 0.9s ease-in-out infinite;min-height:3px }
    #play-btn:active { transform:scale(0.92) }
    .day-link { display:inline-flex;align-items:center;justify-content:center;
                 width:36px;height:36px;border-radius:50%;font-family:ui-monospace,'SF Mono',Menlo,monospace;
                 font-size:14px;font-weight:700;text-decoration:none;transition:opacity 0.15s }
    .day-link:active { opacity:0.7 }
  </style>
  <script>
    function toggleLatest() {
      var a   = document.getElementById('latest-audio');
      var btn = document.getElementById('play-btn');
      var bars = document.getElementById('audio-bars');
      if (a.paused) {
        a.play(); btn.textContent = '⏸'; bars.style.display = 'flex';
      } else {
        a.pause(); btn.textContent = '▶'; bars.style.display = 'none';
      }
      a.onended = function() { btn.textContent = '▶'; bars.style.display = 'none'; };
    }
  </script>
